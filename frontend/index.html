<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sadabahar Restaurant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!--  Header  -->
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <path d="M14 3C8.477 3 4 7.477 4 13c0 3.09 1.4 5.857 3.617 7.723L6 25l4.5-1.5A9.95 9.95 0 0 0 14 24c5.523 0 10-4.477 10-10S19.523 3 14 3Z" fill="#CC0000"/>
            <path d="M9 12h10M9 15.5h7" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Sadabahar</span>
          <span class="brand-sub">Restaurant · AI Assistant</span>
        </div>
      </div>
      <div class="status-pill">
        <span class="status-dot"></span>
        <span>Open 9AM – 11PM</span>
      </div>
    </div>
  </header>

  <!--  Chat Window  -->
  <main class="chat-wrap">
    <div class="chat-window" id="chatWindow">

      <!-- Welcome message -->
      <div class="msg-row bot-row">
        <div class="avatar">S</div>
        <div class="bubble bot-bubble">
          <p>Assalamu Alaikum! 👋 I'm <strong>Sada</strong>, your personal food guide at Sadabahar Restaurant.</p>
          <p>Ask me about our menu, delivery, or anything you're craving today! 🍕🍔</p>
          <span class="timestamp" id="welcomeTime"></span>
        </div>
      </div>

    </div>

    <!--  Typing Indicator  -->
    <div class="typing-indicator" id="typingIndicator" style="display:none;">
      <div class="avatar">S</div>
      <div class="typing-bubble">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!--  Quick Suggestions  -->
    <div class="suggestions" id="suggestions">
      <button class="suggestion-btn" onclick="sendSuggestion(this)">🍕 View Pizzas</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">🍔 View Burgers</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">🚚 Delivery Info</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">🕐 Opening Hours</button>
    </div>

    <!--  Input Bar  -->
    <div class="input-bar">
      <textarea
        id="messageInput"
        class="msg-input"
        placeholder="Ask about our menu, delivery, specials…"
        rows="1"
        maxlength="2000"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send message">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M2 10L18 2L10 18L9 11L2 10Z" fill="white" stroke="white" stroke-width="1" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <p class="input-hint">Developed by <a href="https://vishalsahilai.vercel.app/" target="_blank" rel="noopener noreferrer">Vishal Sahil</a></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
